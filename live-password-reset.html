<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Reset WPI Live Password</title>
  <link rel="stylesheet" href="css/styles.css?v=7.53.4">
  <link rel="stylesheet" href="css/command-palette.css?v=7.53.4">
  <link rel="stylesheet" href="css/site-shell.css?v=7.54.13">
  <link rel="stylesheet" href="css/live-sandbox-v7-56-9.css?v=7.56.9">
</head>
<body class="wpi-live-login-page">
  <main class="live-login-shell">
    <section class="live-login-brand"><p class="live-sandbox-kicker">WPI Live</p><h1>Reset your password</h1><p>Choose a new password for your private team account.</p></section>
    <section class="live-login-card">
      <p class="live-section-kicker">Account recovery</p><h2>Set a new password</h2>
      <form id="passwordResetForm" class="live-login-form">
        <label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirm password<input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required></label>
        <button id="saveNewPasswordButton" type="submit">Save new password</button>
        <p id="passwordResetMessage" class="live-validation-message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="config/live-sandbox.js?v=7.56.9"></script>
  <script src="js/live-backend-v7-56-8.js?v=7.56.9"></script>
  <script src="js/live-password-reset-v7-56-8.js?v=7.56.8"></script>
  <script defer src="js/command-palette.js?v=7.53.4"></script>
  <script defer src="js/site-shell.js?v=7.54.13"></script>
</body>
</html>
