name: Sync tournament data

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: cpi-tournament-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CPI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize enabled tournament sources
        run: python3 scripts/sync-tournament-data.py --sync-enabled --allow-partial

      - name: Rebuild tournament evidence and review queues
        run: python3 scripts/build-tournament-evidence.py

      - name: Rebuild tournament source health
        run: python3 scripts/build-tournament-health.py

      - name: Rebuild JO performance summaries
        run: python3 scripts/build-jo-performance.py

      - name: Check published tournament entry pages
        run: python3 scripts/check-public-tournament-pages.py --network --allow-network-failure

      - name: Build universal tournament operations
        run: python3 scripts/build-tournament-operations.py

      - name: Rebuild completed-tournament archive index
        run: python3 scripts/build-tournament-archive.py

      - name: Publish tournament operations summary
        shell: bash
        run: cat data/tournaments/operations/issue-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update tournament operations incident
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const packet = JSON.parse(fs.readFileSync('data/tournaments/operations/alerts.json', 'utf8'));
            const body = fs.readFileSync('data/tournaments/operations/issue-body.md', 'utf8');
            const title = packet.issueTitle;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (packet.counts.total > 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              }
            } else if (existing && existing.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: '✅ The latest tournament operations run reports no live alerts. Closing this incident automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Rebuild ranking review engine
        run: python3 scripts/build-ranking-review.py

      - name: Rebuild controlled post-JO review packets
        run: python3 scripts/build-post-jo-review.py

      - name: Run tournament regression tests
        run: python3 scripts/test-tournament-pipeline.py

      - name: Validate normalized tournament data
        run: python3 scripts/validate-tournament-data.py

      - name: Validate tournament identity cleanup
        run: python3 scripts/validate-tournament-identity-cleanup.py

      - name: Validate tournament evidence integration
        run: python3 scripts/validate-tournament-evidence.py

      - name: Validate tournament source health
        run: python3 scripts/validate-tournament-health.py

      - name: Test and validate JO performance engine
        run: |
          python3 scripts/test-jo-performance-engine.py
          python3 scripts/validate-jo-performance-engine.py
          node scripts/test-jo-performance-ui.js

      - name: Test and validate ranking review engine
        run: |
          python3 scripts/test-ranking-review-engine.py
          python3 scripts/validate-ranking-review-engine.py

      - name: Test and validate controlled post-JO review
        run: |
          python3 scripts/test-post-jo-review-engine.py
          python3 scripts/validate-post-jo-review.py
          python3 scripts/validate-ranking-change-set.py tests/fixtures/ranking-review/valid-change-set.json
          node scripts/test-post-jo-review-ui.js

      - name: Test tournament evidence interfaces
        run: node scripts/test-tournament-evidence-ui.js

      - name: Test tournament source-health interface
        run: node scripts/test-tournament-source-health-ui.js

      - name: Test and validate tournament operations
        run: |
          python3 scripts/test-tournament-operations-engine.py
          python3 scripts/validate-tournament-operations.py
          node scripts/test-tournament-operations-ui.js

      - name: Commit changed tournament evidence
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/tournaments/raw \
            data/tournaments/normalized \
            data/tournaments/qa \
            data/tournaments/evidence \
            data/tournaments/health \
            data/tournaments/identity \
            data/tournaments/ranking-review-engine \
            data/tournaments/jo-performance \
            data/tournaments/post-jo-review \
            data/tournaments/operations \
            data/tournaments/archive \
            data/tournaments/quiksilver-cup-2026.json \
            qa/tournament-evidence-summary-7.45.1.json \
            qa/tournament-identity-review-7.45.1.csv \
            qa/ranking-review-engine-7.44.0.json \
            qa/jo-performance-engine-7.45.0.json \
            qa/post-jo-review-7.46.0.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tournament source or evidence changes detected."
          else
            git commit -m "Update tournament evidence bank [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
