name: Sync tournament data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpi-tournament-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CPI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize enabled tournament sources
        run: python3 scripts/sync-tournament-data.py --sync-enabled --allow-partial

      - name: Run tournament regression tests
        run: python3 scripts/test-tournament-pipeline.py

      - name: Validate normalized tournament data
        run: python3 scripts/validate-tournament-data.py

      - name: Commit changed source snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments/raw data/tournaments/normalized data/tournaments/qa/2026-*
          if git diff --cached --quiet; then
            echo "No tournament source changes detected."
          else
            git commit -m "Update normalized tournament data [skip ci]"
            git push
          fi
