name: Sync JO live relay

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpi-jo-live-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out CPI main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous relay bank
        shell: bash
        run: |
          git fetch origin cpi-live-relay || true
          if git rev-parse --verify origin/cpi-live-relay >/dev/null 2>&1; then
            git archive origin/cpi-live-relay data/tournaments/live-relay | tar -x
            echo "Restored the previous last-known-good relay bank."
          else
            echo "No prior relay branch exists; verified repository snapshots will seed it."
          fi

      - name: Refresh archived JO Session 3 relay bank on demand
        run: python3 scripts/sync-jo-live-relay.py --event 2026-jo-session-3 --workers 3 --timeout 8 --max-candidates 2

      - name: Publish isolated relay branch
        shell: bash
        run: |
          rm -rf /tmp/cpi-live-relay
          mkdir -p /tmp/cpi-live-relay/data/tournaments
          cp -R data/tournaments/live-relay /tmp/cpi-live-relay/data/tournaments/live-relay

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan cpi-live-relay-publish
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p data/tournaments
          cp -R /tmp/cpi-live-relay/data/tournaments/live-relay data/tournaments/live-relay
          cat > README.md <<'EOF'
          # WPI JO Live Relay

          This branch is generated automatically. It contains only WPI's validated,
          last-known-good Junior Olympics relay bank and per-division freshness metadata.
          Do not edit it manually.
          EOF
          git add README.md data/tournaments/live-relay
          git commit -m "Refresh WPI JO live relay"
          git push --force origin HEAD:cpi-live-relay
