<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Water Polo HQ | Offline</title>
  <link rel="stylesheet" href="css/site-shell.css?v=7.54.13">
  <link rel="stylesheet" href="css/command-palette.css?v=7.53.4">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f7fcff,#e9f8ff);color:#0b2744;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .offline-shell{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:40px 24px}
    .offline-card{width:min(520px,100%);background:#fff;color:#071426;border-radius:24px;padding:30px;box-shadow:0 24px 60px rgba(25,88,122,.14);border:1px solid #d8e9f3}
    .offline-kicker{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#126dff}
    .offline-card h1{font-size:34px;line-height:1;margin:8px 0 14px}
    .offline-card p{line-height:1.55;color:#526274}
    .offline-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .offline-actions a,.offline-actions button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}
    .offline-primary{background:#126dff;color:#fff}
    .offline-secondary{background:#eef4fb;color:#071426}
  </style>
</head>
<body>
  <main class="offline-shell">
    <section class="offline-card" aria-labelledby="offlineTitle">
      <div class="offline-kicker">Water Polo HQ</div>
      <h1 id="offlineTitle">You’re offline.</h1>
      <p>Water Polo HQ needs a connection to refresh live scores, games and stats. Reconnect and retry; previously opened pages may still be available from the app shell.</p>
      <div class="offline-actions"><button class="offline-primary" type="button" onclick="location.reload()">Try again</button><a class="offline-secondary" href="live.html">Live Scores</a></div>
    </section>
  </main>
  <script defer src="js/site-shell.js?v=7.62.3"></script>
  <script defer src="js/command-palette.js?v=7.62.2"></script>
</body>
</html>
