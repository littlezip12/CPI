<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>WPI Live | Redirecting</title>
  <meta name="description" content="Compatibility redirect to the WPI Live game route.">
  <link rel="stylesheet" href="css/command-palette.css?v=7.53.4">
  <link rel="stylesheet" href="css/site-shell.css?v=7.54.13">
</head>
<body>
  <p>Opening WPI Live… <a id="liveGameFallback" href="live-game.html">Continue</a></p>
  <script>
    (() => {
      const target = `live-game.html${window.location.search}${window.location.hash}`;
      document.getElementById("liveGameFallback").href = target;
      window.location.replace(target);
    })();
  </script>
  <script defer src="js/command-palette.js?v=7.62.2"></script>
  <script defer src="js/site-shell.js?v=7.62.3"></script>
</body>
</html>
