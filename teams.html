<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams | Water Polo Index</title>
  <meta name="description" content="Search ranked and tournament-connected youth water polo team profiles by team, club, age group, and gender.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=7.53.4">
  <link rel="stylesheet" href="css/homepage-v8.css?v=7.53.4">
  <link rel="stylesheet" href="css/season-navigation-v7-55-1.css?v=7.55.1">
  <link rel="stylesheet" href="css/command-palette.css?v=7.53.4">
  <link rel="stylesheet" href="css/site-shell.css?v=7.54.13">
  <link rel="stylesheet" href="css/section-landing-v7-53-4.css?v=7.54.15">
  <link rel="stylesheet" href="css/teams-directory-v7-53-4.css?v=7.54.14">
</head>
<body class="cpi-v8-home teams-page">
  <main class="teams-shell">
    <section class="wpi-section-hero wpi-section-hero--teams" aria-labelledby="teamsTitle">
      <div class="wpi-section-hero-copy">
        <p class="wpi-section-kicker">Team directory</p>
        <h1 id="teamsTitle">Find a team. Follow its season.</h1>
        <p>Search ranked and tournament-connected teams, then open rankings, results, club relationships, and game-by-game history.</p>
        <div class="wpi-section-hero-actions">
          <a class="wpi-section-action" href="#team-directory">Find a team</a>
          <a class="wpi-section-action secondary" href="rankings.html">Explore rankings</a>
        </div>
      </div>
      <figure class="wpi-section-hero-media">
        <img src="assets/photos/editorial/wpi-team-photo.jpg" alt="Water polo team posing underwater in the pool" loading="eager">
        <figcaption>Ranked and tournament-connected teams now share one searchable home.</figcaption>
      </figure>
    </section>

    <section class="teams-directory" id="team-directory" aria-labelledby="teamDirectoryTitle">
      <div class="teams-directory-toolbar" aria-label="Team directory filters">
        <label class="sr-only" for="teamSearch">Search team or club</label>
        <input id="teamSearch" type="search" placeholder="Search team or club…" autocomplete="off">
        <label class="sr-only" for="teamGroupFilter">Filter by age and gender</label>
        <select id="teamGroupFilter"><option value="all">All age groups</option></select>
        <label class="sr-only" for="teamTypeFilter">Filter by profile type</label>
        <select id="teamTypeFilter"><option value="all">All profiles</option><option value="ranked">Ranked teams</option><option value="tournament">Tournament-only teams</option></select>
      </div>
      <div class="teams-directory-summary">
        <div><p id="teamDirectoryEyebrow">Featured teams</p><h2 id="teamDirectoryTitle">25 teams to explore</h2></div>
        <span class="teams-directory-count" id="teamDirectoryCount">Loading featured teams…</span>
      </div>
      <div class="teams-grid" id="teamDirectoryGrid" aria-live="polite"></div>
      <div class="teams-load-more"><button id="teamLoadMore" type="button" hidden>Show more teams</button></div>
    </section>
  </main>
  <script src="data.js?v=7.55.1"></script>
  <script src="data/seasons/runtime.js?v=7.55.1"></script>
  <script src="data/identity/runtime.js?v=7.53.6"></script>
  <script src="js/cpi-identity.js?v=7.53.6"></script>
  <script src="data/tournaments/jo-profile-runtime.js?v=7.53.4"></script>
  <script src="js/teams-directory-v7-53-4.js?v=7.54.14"></script>
  <script src="js/logo-display-v7-23-6.js?v=7.53.4"></script>
  <script src="js/season-navigation-v7-55-1.js?v=7.55.1"></script>
  <script defer src="js/command-palette.js?v=7.62.2"></script>
  <script defer src="js/site-shell.js?v=7.62.2"></script>
</body>
</html>
