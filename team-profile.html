<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CPI Team Profile</title>
  <link rel="stylesheet" href="css/team-v11.css"/>
</head>
<body>
  <script>
    const q = new URLSearchParams(location.search);

    location.replace("team.html" + (team ? "?team=" + encodeURIComponent(team) : ""));
  </script>
  <p>Redirecting to team profile...</p>
</body>
</html>
